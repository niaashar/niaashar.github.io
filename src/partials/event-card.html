<article class="event-card @@contextClass"@@idAttr>
  <img class="event-card__image" src="@@image" alt="@@alt" loading="lazy">
  <@@heading class="event-card__title">@@titleMarkup</@@heading>
  <p class="event-card__description">@@description</p>
  <p class="event-card__schedule"><time class="event-card__time" datetime="@@datetime">@@schedule</time></p>
  @@tail
</article>
